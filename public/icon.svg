<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <!-- Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#stroke-grad)" stroke-width="6" opacity="0.15" fill="none" />
  <!-- Icon Graphics -->
  <g transform="translate(128, 128) scale(8)" stroke="url(#stroke-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Photo Frame (32x32 size) -->
    <rect x="2" y="2" width="28" height="28" rx="4" fill="none" />
    <!-- Lens/Sun -->
    <circle cx="10" cy="10" r="3" fill="none" />
    <!-- Mountains -->
    <path d="M4 26 l8-8 6 6 4-4 6 6" fill="none" />
  </g>
</svg>
